name: CI

# Petzy.xcodeproj не хранится в git: он генерируется из project.yml.
# Юнит-тесты не ходят в сеть. UI-тесты нужны живого локального стенда petzy,
# в CI их нет, поэтому здесь только юнит-часть.
#
# Проект собирается под iOS 27 SDK. Раннер macos-26 по умолчанию даёт Xcode 26.6,
# который про iOS 27 ничего не знает: симуляторных целей под такую версию нет,
# и юнит-тесты падают на поиске destination. Версия Xcode берётся из переменной
# репозитория XCODE_VERSION, по умолчанию 27.1.
#
# Если образ раннера ещё не умеет iOS 27, юнит-тесты здесь не пройдут. Тогда
# вариантов два: понизить минимальную версию до iOS 26 в project.yml, либо
# запустить CI на своём раннере с Xcode 27.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Сборка, стиль и юнит-тесты
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Выбрать Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ vars.XCODE_VERSION || '27.1' }}

      - name: Какие Xcode есть на раннере
        run: ls -d /Applications/Xcode*.app

      - name: Показать версию Xcode
        run: xcodebuild -version

      - name: Поставить xcodegen и swiftlint
        run: |
          brew install xcodegen
          brew install swiftlint

      - name: Сгенерировать проект
        run: xcodegen generate

      - name: Выбрать симулятор
        run: |
          # Имя устройства на раннере каждый раз другое, а конкретное знать нельзя.
          # Берём первый доступный iPhone, чтобы не ловить «Unable to find a destination».
          # xargs обязателен: grep даёт имя с концевым пробелом, destination с ним
          # не совпадает и xcodebuild молча подставляет «My Mac».
          SIM_NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          echo "Симулятор: [$SIM_NAME]"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Проверить стиль
        run: swiftlint lint --strict

      - name: Собрать
        run: |
          xcodebuild -project Petzy.xcodeproj -scheme Petzy \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build build

      - name: Юнит-тесты
        run: |
          xcodebuild -project Petzy.xcodeproj -scheme Petzy \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath .build test -only-testing:PetzyTests