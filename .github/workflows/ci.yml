name: CI

# Petzy.xcodeproj не хранится в git: он генерируется из project.yml.
# Юнит-тесты не ходят в сеть. UI-тесты нужны живого локального стенда petzy,
# в CI их нет, поэтому здесь только юнит-часть.
#
# Минимальная версия iOS 26.0: на ней собирается и Xcode 26, и Xcode 27, так что
# раннеру не нужно угадывать версию SDK. При iOS 27 macos-26 отдавал Xcode 26.6,
# и юнит-тесты падали на поиске destination: под такую минимальную версию
# симуляторных целей на образе не было.

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Сборка, стиль и юнит-тесты
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Выбрать Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Показать версию Xcode
        run: xcodebuild -version

      - name: Поставить xcodegen и swiftlint
        run: |
          brew install xcodegen
          brew install swiftlint

      - name: Сгенерировать проект
        run: xcodegen generate

      - name: Выбрать симулятор
        run: |
          # Имя устройства на раннере каждый раз другое, а конкретное знать нельзя.
          # Берём первый доступный iPhone, чтобы не ловить «Unable to find a destination».
          # xargs обязателен: grep даёт имя с концевым пробелом, destination с ним
          # не совпадает и xcodebuild молча подставляет «My Mac».
          SIM_NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]+' | head -1 | xargs)
          echo "Симулятор: [$SIM_NAME]"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"

      - name: Проверить стиль
        run: swiftlint lint --strict

      # Форматирование проверяет и хук, но хук можно обойти, а CI — нет.
      # Версия swiftformat закреплена, чтобы новый не переписал код иначе.
      - name: Проверить форматирование
        run: |
          # The version is pinned, as the comment above says it should be.
          # Homebrew's copy on the runner was 0.63.1 and its indent rule
          # differs from the one this code is written against.
          curl -fsSL -o "$RUNNER_TEMP/swiftformat.zip" \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.64.0/swiftformat.zip
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          "$RUNNER_TEMP/swiftformat/swiftformat" Petzy PetzyTests PetzyUITests --lint

      - name: Собрать
        run: |
          xcodebuild -project Petzy.xcodeproj -scheme Petzy \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build build

      - name: Юнит-тесты
        run: |
          xcodebuild -project Petzy.xcodeproj -scheme Petzy \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            -derivedDataPath .build test -only-testing:PetzyTests
