included:
  - Petzy
  - PetzyTests
  - PetzyUITests

line_length:
  warning: 120
  error: 160
  ignores_comments: false
  ignores_urls: true

excluded:
  - Petzy/Resources

disabled_rules:
  # Запятая в конце литерала в Swift идиоматична и не трогает предыдущие строки
  # при добавлении новых: диффы остаются маленькими.
  - trailing_comma

# Пороги качества кода. Значения не с потолка: замер `make metrics` показывает,
# что сложность в проекте держится около 1–3, а максимум — 7. Порог 8 оставляет
# место на честный разбор случая, но не даёт вырасти функции, которую уже
# трудно читать. Ошибка на 12 — это та сложность, где рефакторинг обязателен.
cyclomatic_complexity:
  warning: 8
  error: 12

# Длина функции в строках без комментариев и пустых строк. Длинная функция
# обычно и сложная, но не всегда: порог ловит и «полотно», которое просится
# разбиться на части.
function_body_length:
  warning: 50
  error: 80

type_body_length:
  warning: 250
  error: 300

file_length:
  warning: 400
  error: 500

# Пять параметров — это уже сигнал, что рядом просится структура.
function_parameter_count:
  warning: 5
  error: 7

nesting:
  type_level: 2
  function_level: 3
